[package]
name = "sshkeystore"
version = "0.1.0"
edition = "2021"
description = "A basic virtual FIDO2/UHID authenticator that stores SSH security keys in SQLite"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sshkeystore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
directories = "6"
ed25519-dalek = "2"
pinentry = "0.5"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uhid-virt = "0.0.8"
